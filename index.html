<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель путешественника Валерии</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <h1 class="header__title">Панель путешественника</h1>
      <p class="header__author">Автор: Валерия</p>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <h2 class="controls__title">Добавить виджет:</h2>
      <div class="controls__buttons">
        <button class="btn btn--primary" data-add="todo">+ Список дел</button>
        <button class="btn btn--secondary" data-add="weather">+ Погода в СПб</button>
        <button class="btn btn--secondary" data-add="currency">+ Курсы валют</button>
        <button class="btn btn--secondary" data-add="quote">+ Цитата дня</button>
      </div>
    </section>

    <section class="dashboard-grid" id="dashboard">
      <!-- Сюда будут добавляться виджеты -->
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
